name: Feature request
description: Suggest an improvement to the integration
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What should the integration do, and why is it useful?
    validations:
      required: true
  - type: textarea
    id: api_evidence
    attributes:
      label: ARTEMIS WebEvo evidence
      description: If the request depends on an ARTEMIS endpoint, describe the endpoint/fields without including credentials or sensitive operational data.
