alias: "ARTEMIS - Statut permanent"
description: "Notification compacte avec statut personnel et action de cycle"
mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: sensor.statut_artemis
    id: refresh

  - trigger: homeassistant
    event: start
    id: refresh

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: ARTEMIS_CYCLE_STATUS
    id: cycle

conditions: []

actions:
  - choose:
      # A tap on the notification action presses the integration button.
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'cycle'
                 and trigger.event.data.get('tag') == 'artemis_status'
                 and is_state_attr('sensor.statut_artemis', 'can_cycle', true) }}
        sequence:
          - action: button.press
            target:
              entity_id: button.cycle_artemis_status

    # All other triggers rebuild the persistent status notification.
    default:
      - condition: template
        value_template: >-
          {{ states('sensor.statut_artemis') not in ['unknown', 'unavailable']
             and state_attr('sensor.statut_artemis', 'code')
             and state_attr('sensor.statut_artemis', 'next_change') }}

      - action: notify.mobile_app_YOUR_PHONE
        data:
          title: >-
            {% set next_dt = as_local(as_datetime(state_attr('sensor.statut_artemis', 'next_change'))) %}
            {% set available = state_attr('sensor.statut_artemis', 'available_personnel') %}
            🚒 {{ available if available is not none else '?' }} dispo ·
            {{ state_attr('sensor.statut_artemis', 'code') }} >
            {% if next_dt.date() == now().date() %}
              {{ next_dt.strftime('%H:%M') }}
            {% else %}
              {{ next_dt.strftime('%d/%m %H:%M') }}
            {% endif %}
            > {{ state_attr('sensor.statut_artemis', 'next_code') }}

          # Android requires a message. A zero-width space keeps it visually compact.
          message: "\u200B"

          data:
            tag: artemis_status
            persistent: true
            sticky: true
            alert_once: true
            notification_icon: mdi:fire-alert
            channel: ARTEMIS Status

            # Main notification tap -> Smartemis.
            clickAction: "app://com.sis.smartemis"

            # Action button -> next state in IND -> DI1 -> AS1 -> IND.
            actions:
              - action: ARTEMIS_CYCLE_STATUS
                title: >-
                  → {{ state_attr('sensor.statut_artemis', 'cycle_next_code') or '?' }}
